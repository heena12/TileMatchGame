name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check (app and engine)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests with engine coverage gate and level validation
        run: npm run test:coverage
